
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viral Expose</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 background:#080b18;color:white;
 font-family:Arial,sans-serif;padding:18px;
}
header{
 text-align:center;padding:28px 10px;
 border-radius:20px;
 background:linear-gradient(135deg,#21104c,#7516a9,#151b46);
 border:1px solid #8e45ff;
 margin-bottom:25px;
}
header h1{font-size:27px}
header p{color:#d9c8ff;margin-top:9px}
.heading{text-align:center;margin:20px 0}
.heading h2{font-size:20px;color:#d9aaff}
.grid{
 display:grid;grid-template-columns:repeat(2,1fr);
 gap:14px;max-width:700px;margin:auto;
}
.card{
 background:#171d30;border:1px solid #394363;
 border-radius:15px;overflow:hidden;
}
.card img,.placeholder{
 width:100%;height:140px;object-fit:cover;
}
.placeholder{
 display:flex;align-items:center;
 justify-content:center;
 font-size:42px;
 background:linear-gradient(135deg,#211c48,#48216d);
}
.info{text-align:center;padding:12px}
.info h3{font-size:15px;margin-bottom:12px}
.btn{
 border:0;border-radius:25px;
 padding:10px 14px;width:100%;
 color:white;font-weight:bold;
 background:linear-gradient(90deg,#762cff,#e000a9);
 cursor:pointer;
}
.btn:disabled{opacity:.6}
.status{
 text-align:center;font-size:12px;
 color:#c8aaff;margin-top:10px;
}
.panel{
 margin-top:25px;padding:18px;
 border:1px solid #6332a2;
 border-radius:15px;text-align:center;
 background:#15152c;
}
@media(max-width:360px){
 .grid{gap:9px}
 .card img,.placeholder{height:115px}
}
</style>
</head>

<body>

<header>
 <h1>🔥 VIRAL EXPOSE 🔥</h1>
 <p>Watch • Unlock • Enjoy</p>
</header>

<div class="heading">
 <h2>🎬 VIDEO COLLECTION</h2>
</div>

<div class="grid">

 <!-- FIRST VIDEO -->
 <div class="card">
  <img
   src="https://fileshare.viraltube.buzz/images/img_1791986436_480.jpg"
   alt="Video 01">

  <div class="info">
   <h3>VIDEO 01</h3>

   <button class="btn" id="unlockBtn"
    onclick="unlockVideo()">
    🔒 UNLOCK VIDEO
   </button>

   <button class="btn" id="watchBtn"
    onclick="watchVideo()"
    style="display:none">
    ▶ WATCH VIDEO
   </button>

   <div class="status" id="status">
    Watch an ad to unlock
   </div>
  </div>
 </div>

 <!-- EMPTY VIDEO CARDS -->
 <div class="card">
  <div class="placeholder">▶</div>
  <div class="info">
   <h3>VIDEO 02</h3>
   <button class="btn" disabled>COMING SOON</button>
  </div>
 </div>

 <div class="card">
  <div class="placeholder">▶</div>
  <div class="info">
   <h3>VIDEO 03</h3>
   <button class="btn" disabled>COMING SOON</button>
  </div>
 </div>

 <div class="card">
  <div class="placeholder">▶</div>
  <div class="info">
   <h3>VIDEO 04</h3>
   <button class="btn" disabled>COMING SOON</button>
  </div>
 </div>

 <div class="card">
  <div class="placeholder">▶</div>
  <div class="info">
   <h3>VIDEO 05</h3>
   <button class="btn" disabled>COMING SOON</button>
  </div>
 </div>

 <div class="card">
  <div class="placeholder">▶</div>
  <div class="info">
   <h3>VIDEO 06</h3>
   <button class="btn" disabled>COMING SOON</button>
  </div>
 </div>

</div>

<div class="panel">
 <h3>💎 PREMIUM EXPERIENCE</h3>
 <p style="color:#aaa;margin-top:8px">
 Unlock videos and enjoy your collection
 </p>
</div>

<script>
const VIDEO_LINK = "https://t.me/c/3962895219/2";
const BLOCK_ID = "58782";

let unlocked = localStorage.getItem("video01_unlocked") === "yes";

let adController = null;

try {
 if (window.Adsgram) {
  adController = window.Adsgram.init({
   blockId: BLOCK_ID
  });
 }
} catch(error) {
 console.error(error);
}

function updateUI(){
 if(unlocked){
  document.getElementById("unlockBtn").style.display="none";
  document.getElementById("watchBtn").style.display="block";
  document.getElementById("status").innerText="✅ VIDEO UNLOCKED";
 }
}

async function unlockVideo(){

 const btn=document.getElementById("unlockBtn");
 const status=document.getElementById("status");

 if(unlocked){
  updateUI();
  return;
 }

 if(!adController){
  status.innerText="Ad unavailable. Open inside Telegram Mini App.";
  return;
 }

 btn.disabled=true;
 btn.innerText="LOADING AD...";
 status.innerText="Please watch the full advertisement";

 try{
  const result=await adController.show();

  if(result && result.done===true && !result.error){
   unlocked=true;
   localStorage.setItem("video01_unlocked","yes");
   updateUI();
   status.innerText="🎉 Successfully Unlocked!";
  }else{
   status.innerText="Ad not completed. Try again.";
   btn.disabled=false;
   btn.innerText="🔒 UNLOCK VIDEO";
  }

 }catch(error){
  console.error(error);
  status.innerText="Ad skipped or unavailable. Try again.";
  btn.disabled=false;
  btn.innerText="🔒 UNLOCK VIDEO";
 }
}

function watchVideo(){
 if(!unlocked)return;

 const tg=window.Telegram && window.Telegram.WebApp;

 if(tg && tg.openTelegramLink){
  tg.openTelegramLink(VIDEO_LINK);
 }else{
  window.open(VIDEO_LINK,"_blank");
 }
}

updateUI();
</script>

</body>
</html>
