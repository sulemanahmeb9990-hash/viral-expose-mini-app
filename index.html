  <!-- JavaScript Logic -->
  <script>
    // Initialize Telegram Web App
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    let targetChannelUrl = "";

    function openUnlockPopup(channelUrl) {
      targetChannelUrl = channelUrl;
      document.getElementById('popup-modal').classList.remove('hidden');
    }

    document.getElementById('popup-confirm-btn').addEventListener('click', function() {
      // Hide popup
      document.getElementById('popup-modal').classList.add('hidden');

      // Redirect to Telegram Channel
      if (targetChannelUrl) {
        if (window.Telegram && window.Telegram.WebApp) {
          Telegram.WebApp.openTelegramLink(targetChannelUrl);
        } else {
          window.open(targetChannelUrl, '_blank');
        }
      }
    });        function showAdAndUnlock(videoUrl) {
      if (window.Adsgram) {
        const AdController = window.Adsgram.init({ blockId: "58428" });
        
        AdController.show().then((result) => {
          window.open(videoUrl, '_blank');
        }).catch((result) => {
          alert("ভিডিওটি দেখতে সম্পূর্ণ অ্যাডটি দেখতে হবে!");
        });
      } else {
        alert("অ্যাড লোড হতে সমস্যা হয়েছে, দয়া করে আবার চেষ্টা করুন।");
      }
    }
  </script>
