<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral Expose - Video Unlocker</title>
    <!-- AdsGram SDK Script -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 10px;
        }
        .header {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #ff334b;
            padding: 10px 0;
        }
        .video-card {
            background-color: #1e1e1e;
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
            border: 1px solid #333;
        }
        .video-thumb {
            position: relative;
            width: 100%;
            height: 180px;
            background-size: cover;
            background-position: center;
        }
        .lock-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
        }
        .video-info {
            padding: 10px;
        }
        .video-title {
            font-size: 16px;
            margin-bottom: 10px;
        }
        .watch-btn {
            width: 100%;
            background-color: #2b6cb0;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .watch-btn.unlocked {
            background-color: #2f855a;
        }
    </style>
</head>
<body>

    <div class="header">VIRAL EXPOSE</div>

    <!-- ভিডিও কার্ড ১ -->
    <div class="video-card">
        <div class="video-thumb" style="background-image: url('https://via.placeholder.com/400x200')">
            <div class="lock-badge" id="badge_1">🔒 লক করা</div>
        </div>
        <div class="video-info">
            <div class="video-title">উফ.....পুরাই আগুন (স্পেশাল ভিডিও)</div>
            <button class="watch-btn" id="btn_1" onclick="handleWatchVideo('1', 'https://www.youtube.com/watch?v=YOUR_VIDEO_ID')">
                ▶ Watch Video (০/১)
            </button>
        </div>
    </div>

    <script>
        // আপনার AdsGram Block ID এখানে বসান (যেমন: "int-xxxx" বা আপনার প্রোভাইড করা আইডি)
        const BLOCK_ID = 
        
        // Adsgram ইনিশিয়ালাইজ করা
        let adController;
        if (window.Adsgram) {
            adController = window.Adsgram.init({ blockId: BLOCK_ID });
        }

        // পেজ লোড হওয়ার সময় চেক করা ভিডিও আগে আনলক করা আছে কি না
        window.onload = function() {
            const isUnlocked = localStorage.getItem("unlocked_1");
            if (isUnlocked === "true") {
                applyUnlockedUI('1');
            }
        };

        function handleWatchVideo(videoId, videoUrl) {
            // যদি আগেই আনলক করা থাকে সরাসরি ভিডিও লিংকে পাঠিয়ে দেবে
            if (localStorage.getItem(`unlocked_${videoId}`) === "true") {
                window.location.href = videoUrl;
                return;
            }

            if (!adController) {
                alert("এডসগ্রাম লোড হতে সমস্যা হচ্ছে। দয়া করে একটু পরে চেষ্টা করুন।");
                return;
            }

            // অ্যাড দেখানো শুরু হবে
            adController.show()
                .then((result) => {
                    // ইউজার সফলভাবে অ্যাড দেখলে
                    localStorage.setItem(`unlocked_${videoId}`, "true");
                    applyUnlockedUI(videoId);
                    
                    // সফল মেসেজ বা সরাসরি ভিডিও ওপেন করা
                    alert("অভিনন্দন! বিজ্ঞাপন দেখা শেষ, ভিডিওটি আনলক হয়েছে।");
                    window.location.href = videoUrl; 
                })
                .catch((result) => {
                    // ইউজার অ্যাড মাঝপথে কেটে দিলে বা এরর আসলে
                    console.log("Ad error or skipped", result);
                    alert("বিজ্ঞাপনটি সম্পূর্ণ দেখা হয়নি, তাই ভিডিওটি আনলক করা যায়নি।");
                });
        }

        function applyUnlockedUI(videoId) {
            const btn = document.getElementById(`btn_${videoId}`);
            const badge = document.getElementById(`badge_${videoId}`);
            
            if (btn) {
                btn.innerText = "▶ Watch Video (১/১)";
                btn.classList.add("unlocked");
            }
            if (badge) {
                badge.innerText = "🔓 আনলকড";
                badge.style.background = "rgba(47, 133, 90, 0.8)";
            }
        }
    </script>
</body>
</html>
