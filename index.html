<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral Expose - Video Unlocker</title>
    <!-- AdsGram SDK Script -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 10px;
        }
        .header {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #ff334b;
            padding: 10px 0;
        }
        .video-card {
            background-color: #1e1e1e;
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
            border: 1px solid #333;
        }
        .video-thumb {
            position: relative;
            width: 100%;
            height: 180px;
            background-size: cover;
            background-position: center;
        }
        .lock-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
        }
        .video-info {
            padding: 10px;
        }
        .video-title {
            font-size: 16px;
            margin-bottom: 10px;
        }
        .watch-btn {
            width: 100%;
            background-color: #2b6cb0;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .watch-btn.unlocked {
            background-color: #2f855a;
        }
    </style>
</head>
<body>

    <div class="header">VIRAL EXPOSE</div>

    <!-- ভিডিও কার্ড ১ -->
<div class="video-card">
    <!-- থাম্বনেইল লিংক বসানো হলো -->
    <div class="video-thumb" style="background-image: url('https://fileshare.viraltube.buzz/images/img_1791986436_480.jpg')">
        <div class="lock-badge" id="badge_1">🔒 লক করা</div>
    </div>
    <div class="video-info">
        <div class="video-title">উফ.....পুরাই আগুন (স্পেশাল ভিডিও)</div>
        <!-- ভিডিও লিংক বসানো হলো -->
        <button class="watch-btn" id="btn_1" onclick="handleWatchVideo('1', 'https://t.me/c/3962895219/2')">
            ▶ Watch Video (০/১)
        </button>
    </div>
</div>

    
<script>
const BLOCK_ID = "58691";
let adController = null;
    try {
        adController = window.Adsgram.init({
    blockId: BLOCK_ID,
    debug: true,
    debugConsole: true,
    debugBannerType: "RewardedVideo"
        });
window.addEventListener("load", initAds);

function handleWatchVideo(videoId, videoUrl) {
    if (!adController) {
        alert("AdsGram এখনো লোড হয়নি।");
        return;
    }

    adController.show()
        .then((result) => {
            if (result && result.done === false) {
                alert("বিজ্ঞাপন সম্পূর্ণ হয়নি।");
                return;
            }

            localStorage.setItem(
                "unlocked_" + videoId,
                "true"
            );

            applyUnlockedUI(videoId);
            alert("ভিডিও আনলক হয়েছে!");
            window.location.href = videoUrl;
        });
        });
}

function applyUnlockedUI(videoId) {
    const btn = document.getElementById("btn_" + videoId);
    const badge = document.getElementById("badge_" + videoId);

    if (btn) {
        btn.innerText = "▶ Watch Video (১/১)";
        btn.classList.add("unlocked");
    }

    if (badge) {
        badge.innerText = "🔓 আনলকড";
    }
}

window.addEventListener("load", () => {
    if (localStorage.getItem("unlocked_1") === "true") {
        applyUnlockedUI("1");
    }
});
</script>
</body>
</html>
